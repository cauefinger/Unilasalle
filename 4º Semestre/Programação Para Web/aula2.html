<!DOCTYPE html>
<html lang="pt-BR">
<form action="sucessoaula2.html" method="GET">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário</title>

</head>
<body>
    <main>
        <h1>Formulário de cadastro</h1>
        
        <form>action= "sucessoaula2.html" method="GET"</form>

        <fieldset>
            <legend>Dados Pessoais</legend>

            <div>
                <label for="data_nascimento">Data de nascimento:</label>
                <input type="date" name="data_nascimento" id="data_nascimento" required>
                                    <output for="data_nascimento">Idade</output>
                </div>

                <br>

                <div>
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" name="peso" required>
                </div>

                <br>

                <div>
                    <label for="tipo_sanguineo">Tipo Sanguíneo:</label>
                    <select id="tipo_sanguineo" name="tipo_sanguineo" required>
                        <option value="">Selecione</option>
                        <option value="O">O</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="AB">AB</option>
                    </select>
                </div>

                <br>

                <div>
                    <label for="fator_rh">Fator RH:</label>
                    <select id="fator_rh" name="fator_rh" required>
                        <option value="">Selecione</option>
                        <option value="+">+</option>
                        <option value="-">-</option>
                    </select>
                </div>

                <br>

                <fieldset>
                    <legend>Gênero</legend>

                    <input type="radio" id="feminino" name="genero" value="feminino" required>
                    <label for="feminino">Feminino</label>

                    <input type="radio" id="masculino" name="genero" value="masculino">
                    <label for="masculino">Masculino</label>

                    <input type="radio" id="outro" name="genero" value="outro">
                    <label for="outro">Outro</label>

                </fieldset>

                <br>

                <div>
                    <label for="documento">Número de documento:</label>
                    <input type="text" id="documento" name="documento" required>
                </div>

            </fieldset>

            <br>

            <fieldset>
                <legend>Informações Adicionais</legend>

                <div>
                    <input type="checkbox" id="doador" name="informacoes" value="doador">
                    <label for="doador">Sou doador de sangue</label>
                </div>

                <div>
                    <input type="checkbox" id="atividade" name="informacoes" value="atividade">
                    <label for="atividade">Pratico atividade física</label>
                </div>

                <div>
                    <input type="checkbox" id="alergia" name="informacoes" value="alergia">
                    <label for="alergia">Possuo alergias</label>
                </div>

            </fieldset>

            <br>

            <button type="submit">Enviar</button>

        </form>

    </main>

</body>

</html>
            </div>
        </fieldset>

    </main>
</body>
</html>
